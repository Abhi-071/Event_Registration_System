<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navigation Bar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container-fluid">

<a class="navbar-brand" href="/admin/dashboard">Admin Panel</a>

<div>

<a href="/admin/dashboard" class="btn btn-outline-light me-2">Dashboard</a>

<a href="/admin/events" class="btn btn-outline-light me-2">Manage Events</a>

<a href="/admin/analytics" class="btn btn-outline-light me-2">Analytics</a>

<a href="/" class="btn btn-success">User Portal</a>

</div>

</div>

</nav>

<div class="container mt-4">

<h2 class="text-center mb-4">Admin Dashboard</h2>

<div class="row text-center">

<div class="col-md-6">

<div class="card bg-primary text-white shadow">

<div class="card-body">

<h4>Total Events</h4>

<h2 th:text="${totalEvents}"></h2>

</div>

</div>

</div>

<div class="col-md-6">

<div class="card bg-success text-white shadow">

<div class="card-body">

<h4>Total Registrations</h4>

<h2 th:text="${totalRegistrations}"></h2>

</div>

</div>

</div>

</div>

<br>

<h4>Event List</h4>

<table class="table table-bordered">

<thead class="table-dark">

<tr>

<th>Event</th>
<th>Venue</th>
<th>Date</th>
<th>Participants</th>

</tr>

</thead>

<tbody>

<tr th:each="ev : ${events}">

<td th:text="${ev.title}"></td>

<td th:text="${ev.venue}"></td>

<td th:text="${ev.eventDate}"></td>

<td>

<a th:href="@{/admin/participants/{name}(name=${ev.title})}"
class="btn btn-info btn-sm">

View Participants

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>
</html>
