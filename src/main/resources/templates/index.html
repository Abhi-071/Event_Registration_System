<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Event Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-4">Available Events</h2>

<p th:text="${message}" class="text-danger text-center"></p>

<div class="row">

<div class="col-md-4 mb-4" th:each="ev : ${events}">

<div class="card shadow">

<div class="card-body">

<h5 class="card-title" th:text="${ev.title}"></h5>

<p class="card-text">

<b>Venue:</b> <span th:text="${ev.venue}"></span><br>

<b>Date:</b> <span th:text="${ev.eventDate}"></span><br>

<b>Capacity:</b> <span th:text="${ev.capacity}"></span>

</p>

<form action="/register" method="post">

<input type="hidden" name="eventName" th:value="${ev.title}">

<div class="mb-2">
<input type="text" name="name" class="form-control" placeholder="Enter your name" required>
</div>

<button class="btn btn-primary w-100">

Register

</button>

</form>

</div>

</div>

</div>

</div>

<br>

<a href="/events" class="btn btn-success w-100">

View Registered Events

</a>

</div>

</body>
</html>
