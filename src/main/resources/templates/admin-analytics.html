<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Event Analytics</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<!-- Navigation -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container-fluid">

<a class="navbar-brand" href="/admin/dashboard">Admin Panel</a>

<div>

<a href="/admin/dashboard" class="btn btn-outline-light me-2">Dashboard</a>

<a href="/admin/events" class="btn btn-outline-light me-2">Manage Events</a>

<a href="/admin/analytics" class="btn btn-outline-light me-2">Analytics</a>

<a href="/" class="btn btn-success">User Portal</a>

</div>

</div>

</nav>

<div class="container mt-4">

<h2 class="text-center mb-4">Event Analytics</h2>

<canvas id="chart"></canvas>

</div>

<script th:inline="javascript">

let stats = [[${stats}]];

let labels = Object.keys(stats);

let values = Object.values(stats);

new Chart(document.getElementById("chart"), {

type: "bar",

data: {

labels: labels,

datasets: [{

label: "Registrations",

data: values

}]

}

});

</script>

</body>

</html>
